<!doctype html>
<html><head><meta charset="utf-8"><title>Station</title>
<link rel="stylesheet" href="tokens.css">
<style>
body{display:grid;grid-template-rows:76px 1fr 56px}
header{display:grid;grid-template-columns:auto 1fr auto auto auto;background:var(--surface);border-bottom:1px solid var(--line)}
header>*{display:flex;align-items:center;gap:var(--s-4);padding:0 var(--s-6);border-inline-start:1px solid var(--line)}
header>:first-child{border:0}
.logo img{height:34px;display:block}
.pn{font-size:var(--t-xl);font-weight:700;line-height:1}
.meta{font-size:var(--t-sm);color:var(--tx-3);margin-top:4px}.meta b{color:var(--tx-2);font-weight:500}
.prog .big{font-size:var(--t-xl);font-weight:700;line-height:1}
.segs{display:flex;gap:3px;direction:ltr}.segs i{width:12px;height:12px;background:var(--accent);border-radius:1px}.segs i.nb{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.verdict{background:var(--fix-solid);color:#fff;gap:var(--s-5);min-width:470px;border:0}
.verdict .w{font-size:var(--t-2xl);font-weight:800;line-height:1}
.verdict .c{font-size:var(--t-md);line-height:1.35;font-weight:500}.verdict .c b{font-size:var(--t-lg);font-weight:800}
.clock .t{font-size:var(--t-lg);font-weight:600;line-height:1.1}
main{display:grid;grid-template-columns:1fr 860px;min-height:0}
.view{position:relative;overflow:hidden}
.reg{position:absolute;width:14px;height:14px;opacity:.5}
.reg::before,.reg::after{content:'';position:absolute;background:var(--tx-3)}
.reg::before{left:6px;top:0;width:1px;height:14px}.reg::after{top:6px;left:0;height:1px;width:14px}
#part,#over{position:absolute;inset:0}
.vhead{position:absolute;top:var(--s-5);inset-inline-start:var(--s-6);display:flex;flex-direction:column;gap:2px;font-size:var(--t-sm);color:var(--tx-3)}
.vhead b{color:var(--tx-2);font-weight:600}
.tools{position:absolute;bottom:var(--s-4);inset-inline:var(--s-4);display:flex;gap:var(--s-3)}
/* list */
.list{background:var(--surface);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
table{width:100%;border-collapse:collapse}
th{font-size:var(--t-xs);font-weight:500;color:var(--tx-3);text-align:start;padding:0 var(--s-4);height:44px;border-bottom:1px solid var(--line-2)}
th.n,td.n{text-align:end}
th .u{font-weight:400;opacity:.8}
td{height:68px;padding:0 var(--s-4);border-bottom:1px solid var(--line);white-space:nowrap}
tr.sel td{background:var(--surface-3)}
tr.sel td:first-child{box-shadow:inset calc(var(--dirsign) * -3px) 0 0 var(--accent)}
tr.nb td{background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(255,255,255,.025) 7px 8px);color:var(--tx-3)}
tr.nb .bid{color:var(--tx-3)}
.seq{font-size:var(--t-sm);color:var(--tx-3);width:40px}
.bid{font-size:var(--t-lg);font-weight:700;width:96px}
.bid .badge{margin-inline-start:6px;height:20px;font-size:11px}
.val{font-size:var(--t-xl);font-weight:600;letter-spacing:-.01em}
.val.v-in{font-weight:500;color:#D5DDE6}
.val.v-chk{font-weight:500;color:#CFA457}.val.v-fix{font-weight:800;color:#FF5A5F}
.val.nm{font-size:var(--t-sm);font-weight:500}
td.hov{background:var(--fix-bg);box-shadow:inset 0 0 0 1px var(--fix)}
.legend{margin-top:auto;display:flex;gap:var(--s-5);align-items:center;padding:0 var(--s-4);height:44px;border-top:1px solid var(--line);font-size:var(--t-xs);color:var(--tx-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:1px;margin-inline-end:6px;vertical-align:-1px}
/* tooltip */
.tip{position:fixed;z-index:5;width:316px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-1);box-shadow:var(--shadow);padding:var(--s-3) var(--s-4) var(--s-4);font-size:var(--t-sm)}
.tip .r{display:flex;justify-content:space-between;height:26px;align-items:center;color:var(--tx-2)}
.tip .r b{color:var(--tx);font-weight:600}.tip .r b.v-fix{color:var(--fix)}
.tip .rule{margin:2px 0 8px}
.tip::after{content:'';position:absolute;bottom:-6px;width:10px;height:10px;background:var(--surface-2);border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);transform:rotate(45deg);inset-inline-start:40px}
/* docked bend card: drawing title block */
.card{position:absolute;z-index:4;top:var(--s-5);inset-inline-end:var(--s-5);width:560px;background:var(--surface);border:1px solid var(--line-2);border-radius:2px;box-shadow:var(--shadow)}
.tb{display:grid;grid-template-columns:1.1fr 1fr .8fr 1fr 44px;border-bottom:1px solid var(--line-2)}
.tb>div{padding:8px 12px;border-inline-start:1px solid var(--line)}
.tb>div:first-child{border:0}
.tb .k{font-size:10.5px;color:var(--tx-3);letter-spacing:.04em}
.tb .v{font-size:var(--t-md);font-weight:600;margin-top:2px}
.tb .id{font-size:var(--t-xl);font-weight:800;line-height:1.1}
.tb .x{display:grid;place-items:center;color:var(--tx-3)}
.sec{padding:12px 16px 4px}
.mr{display:grid;grid-template-columns:104px 1fr 80px 92px;align-items:center;column-gap:10px;padding:8px 16px;border-top:1px solid var(--line)}
.mr .n{font-size:var(--t-sm);color:var(--tx-2)}
.mr .nums{display:flex;align-items:baseline;gap:10px}
.mr .ex{color:var(--tx-3);font-size:var(--t-md)}
.mr .ac{font-size:var(--t-lg);font-weight:600}
.mr .ac.v-in{color:var(--tx)}
.mr .dv{font-size:var(--t-md);text-align:end}
.mr .dim{grid-column:2 / 4;margin-top:4px}
.mr .vd{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:600}
.mr.bad{background:linear-gradient(90deg,var(--fix-bg),var(--fix-bg))}
.act{display:flex;gap:var(--s-3);align-items:flex-start;padding:10px 16px 14px;font-size:var(--t-md);font-weight:500}
.act .ic{color:var(--fix);margin-top:2px}
.slot{position:absolute;top:var(--s-5);inset-inline-end:var(--s-5);width:560px;padding:18px 20px;color:var(--tx-3);font-size:var(--t-sm);border:1px dashed var(--line-2);border-radius:2px}
.slot b{display:block;color:var(--tx-2);font-size:var(--t-md);font-weight:600;margin:6px 0 4px}
footer{display:flex;align-items:center;background:var(--surface);border-top:1px solid var(--line)}
footer>*{display:flex;align-items:center;gap:var(--s-3);height:100%;padding:0 var(--s-5);border-inline-start:1px solid var(--line)}
footer>:first-child{border:0;flex:1;color:var(--tx-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.scanchip{font-size:var(--t-sm);border:1px solid var(--line-2);border-radius:var(--r-1);padding:4px 10px;color:var(--tx-2)}
.scanchip.cur{border-color:var(--accent);color:var(--tx)}
</style></head>
<body class="theme-dark">
<header>
  <div class="logo"><img src="sherman-logo-white.png" alt="Sherman"></div>
  <div><div><div class="pn num">10839000</div><div class="meta" id="meta"></div></div></div>
  <div class="prog"><div><div class="lbl" id="donel"></div><div class="big num" id="done"></div></div><div class="segs" id="segs"></div></div>
  <div class="verdict" id="verdict"></div>
  <div class="clock"><div><div class="t num" id="clock"></div><div class="lbl" id="stn"></div></div><span class="badge" id="langsw"></span></div>
</header>
<main>
  <section class="view bp" id="view">
    <span class="reg" style="top:12px;left:12px"></span><span class="reg" style="top:12px;right:12px"></span><span class="reg" style="bottom:84px;left:12px"></span><span class="reg" style="bottom:84px;right:12px"></span>
    <div id="part"></div><svg id="over"></svg>
    <div class="vhead" id="vhead"></div>
    <div class="tools" id="tools"></div>
  </section>
  <section class="list" id="list"></section>
</main>
<footer id="foot"></footer>
<script src="icons.js"></script><script src="shared.js"></script>
<script>
const q=new URLSearchParams(location.search), L=q.get('lang')||'he', ST=q.get('state')||'default', SCAN=q.get('scan')||'full'
document.documentElement.lang=L; document.documentElement.dir=L==='he'?'rtl':'ltr'
document.documentElement.style.setProperty('--dirsign', L==='he'?1:-1)
const T={he:{done:'כיפופים בוצעו',FIX:'לתקן',CHECK:'לבדוק',OK:'תקין',NB:'טרם כופף',nm:'לא נמדד',toFix:'לתיקון',toCheck:'לבדיקה',oot:'נמצאה חריגה מטולרנס',missing:'בדיקה סופית, אך חסרים כיפופים',
  meta:j=>`Joggle bracket · מתכון <b>v1</b> · עבודה <b class="num">${j}</b> · סידורי —`,stn:'עמדה <span class="num">cell-1</span> · מחובר',other:'English',
  full:'סריקה מלאה',partial:'סריקת ביניים',
  hintT:'בחרו כיפוף',hint:'לחיצה על כיפוף ברשימה או על הדגם מציגה כאן את כל המדידות שלו, מחוברות לקו הכיפוף שנמדד.',
  cad:'שרטוט',fin:'חלק גמור',scan:'סריקה',heat:'מפת סטיות',lblP:'תוויות: חריגות',lblA:'הכול',next:'החריגה הבאה',fit:'כל החלק',
  bend:'כיפוף',res:'תוצאה',fa:'כנף A',fb:'כנף B',ang:'זווית',line:'קו כיפוף',mm:'מ״מ',move:'מהלך 1',
  legend:['מחוץ לטולרנס','בגבול – לבדוק','בטולרנס – ללא צבע'],legHint:'ריחוף על ערך: צפוי וטולרנס',
  waiting:'ממתין לסריקה הבאה',recent:'סריקות אחרונות',assist:'סיוע למפעיל – אינו קבלה או דחייה אוטומטית',pdf:'הורדת PDF',
  exp:'צפוי',act:'בפועל',dev:'סטייה',tol:'טולרנס',far:'כיפוף יתר',inT:'בטולרנס',outT:'מחוץ',rev:'לבדוק',
  seqK:'רצף',scanK:'סריקה',meas:'מדידות · צפוי ← בפועל',actK:'פעולה',close:'סגירה',
  action:'מחוץ לטולרנס. לתקן, או להפריש את החלק ולעדכן את ראש המשמרת.'},
 en:{done:'Bends done',FIX:'FIX',CHECK:'CHECK',OK:'OK',NB:'Not bent yet',nm:'Not measured',toFix:'to fix',toCheck:'to check',oot:'Out of tolerance found',missing:'Final check, but bends are missing',
  meta:j=>`Joggle bracket · Recipe <b>v1</b> · Job <b class="num">${j}</b> · Serial —`,stn:'Station <span class="num">cell-1</span> · Online',other:'עברית',
  full:'Full scan',partial:'Stage scan',
  hintT:'Select a bend',hint:'Tap a bend in the list or on the model to show all its measurements here, attached to the measured bend line.',
  cad:'CAD',fin:'Finished part',scan:'Scan',heat:'Heatmap',lblP:'Labels: problems',lblA:'All',next:'Next problem',fit:'Fit part',
  bend:'Bend',res:'Result',fa:'Flange A',fb:'Flange B',ang:'Angle',line:'Bend line',mm:'mm',move:'Move 1',
  legend:['Out of tolerance','Borderline – check','In tolerance – no colour'],legHint:'Hover a value: nominal and tolerance',
  waiting:'Waiting for the next scan',recent:'Recent scans',assist:'Operator assist – not an automatic accept/reject',pdf:'Download PDF',
  exp:'Expected',act:'Actual',dev:'Deviation',tol:'Tolerance',far:'bent too far',inT:'In tol.',outT:'Out',rev:'Check',
  seqK:'SEQUENCE',scanK:'SCAN',meas:'MEASUREMENTS · EXPECTED → ACTUAL',actK:'ACTION',close:'Close',
  action:'Out of tolerance. Correct it, or set the part aside and tell the shift lead.'}}[L]
const $=id=>document.getElementById(id)
// data: FULL (real 7eec6c) or PARTIAL scan_1 (real 4f667b)
const PARTIAL=[
  ['B1',1,'CHECK',1,['3.6',null,null,'nm'],['13.0','13.1','+0.1','check'],['145.0','145.9','+0.9','check']],
  ['B2',2,'CHECK',1,['21.4',null,null,'nm'],['3.6',null,null,'nm'],['145.0','147.9','+2.9','check']],
  ['B3',3,'CHECK',0,['3.6',null,null,'nm'],['13.0','13.3','+0.3','check'],['145.0','142.4','−2.6','check']],
  ['B4',4,'CHECK',0,['21.4',null,null,'nm'],['3.6',null,null,'nm'],['145.0','144.3','−0.7','check']],
  ['B5',5,'CHECK',0,['12.0','12.1','+0.1','ok'],['41.2','41.5','+0.3','ok'],['90.0','89.3','−0.7','check']],
  ['B10',6,'OK',0,['41.2','41.4','+0.2','ok'],['312.9','313.3','+0.4','ok'],['90.0','89.3','−0.7','ok']],
  ['B7',7,'FIX',0,['12.0','12.0','0.0','ok'],['41.2','41.5','+0.3','ok'],['90.0','88.2','−1.8','fix']],
  ['B12',8,'FIX',0,['41.2','41.5','+0.3','ok'],['312.9','313.2','+0.3','ok'],['90.0','88.3','−1.7','fix']],
  ['B6',9,'NB'],['B11',10,'NB'],['B8',11,'NB'],['B9',12,'NB']].map(([id,seq,v,move,a,b,g])=>({id,seq,v,move,a,b,g}))
const BENDS=SCAN==='partial'?PARTIAL:SQ.bends
const byId=id=>BENDS.find(b=>b.id===id)
const S=SCAN==='partial'?{job:'4f667b',fix:2,chk:5,sub:T.missing,done:8,file:'10839000_01_SCAN_1 1.ply',kind:T.partial,clock:'14:10:31'}:{job:'7eec6c',fix:4,chk:8,sub:T.oot,done:12,file:'10839000_01_FULL_SCAN 1.ply',kind:T.full,clock:'14:08:12'}
const SEL=ST==='click'?'B11':null
$('meta').innerHTML=T.meta(S.job); $('stn').innerHTML=T.stn; $('langsw').textContent=T.other; $('clock').textContent=S.clock
$('donel').textContent=T.done; $('done').textContent=`${S.done} / 12`
$('vhead').innerHTML=`<b>${S.kind}</b><span class="num">${S.file}</span>`
$('segs').innerHTML=BENDS.map(b=>`<i class="${b.v==='NB'?'nb':''}"></i>`).join('')
$('verdict').innerHTML=`${icon('fix',34,2.5)}<div class="w">${T.FIX}</div><div class="c"><b class="num">${S.fix}</b> ${T.toFix} · <b class="num">${S.chk}</b> ${T.toCheck}<br>${S.sub}</div>`
$('tools').innerHTML=`<div class="seg"><span class="on">${icon('cad')}${T.cad}</span><span>${icon('finished')}${T.fin}</span><span class="on">${icon('scan')}${T.scan}</span><span>${icon('heatmap')}${T.heat}</span></div>
<div class="seg"><span class="on">${icon('tag')}${T.lblP}</span><span>${T.lblA}</span></div><span style="flex:1"></span>
<div class="seg"><span>${icon('next')}${T.next}</span><span>${icon('fit')}${T.fit}</span></div>`
if(!SEL) document.getElementById('view').insertAdjacentHTML('beforeend',`<div class="slot tblock"><span class="crn a"></span><span class="crn b"></span><span class="crn c"></span><span class="crn d"></span><div class="rule">${T.bend} · —</div><b>${T.hintT}</b>${T.hint}</div>`)
// list: only out (red) and borderline (yellow) carry colour
const vcls={ok:'v-in',check:'v-chk',fix:'v-fix',nm:'v-nm'}
const chip=v=>v==='FIX'?`<span class="chip FIX">${icon('fix',16,2.4)}${T.FIX}</span>`:v==='CHECK'?`<span class="chip CHECK">${icon('check',16,1.8)}${T.CHECK}</span>`:v==='OK'?`<span class="chip OK">${icon('ok',16,2.2)}${T.OK}</span>`:`<span class="chip NB">${icon('notbent',16,1.6)}${T.NB}</span>`
const val=(c,k,id)=>!c?`<td class="n"><span class="val nm">—</span></td>`:c[3]==='nm'?`<td class="n"><span class="val nm v-nm">${T.nm}</span></td>`:
  `<td class="n ${ST==='hover'&&id==='B11'&&k==='g'?'hov':''}" ${id==='B11'&&k==='g'?'id="hovcell"':''}><span class="val ${vcls[c[3]]}"><span class="num">${c[1]}${k==='g'?'°':''}</span></span></td>`
$('list').innerHTML=`<table><thead><tr><th>#</th><th>${T.bend}</th><th>${T.res}</th><th class="n">${T.fa} <span class="u">· ${T.mm}</span></th><th class="n">${T.fb} <span class="u">· ${T.mm}</span></th><th class="n">${T.ang} <span class="u">· °</span></th></tr></thead><tbody>
${BENDS.map(b=>`<tr class="${b.id===SEL?'sel':''} ${b.v==='NB'?'nb':''}"><td class="seq num">${b.seq}</td><td class="bid"><span class="num">${b.id}</span>${b.move?`<span class="badge">${T.move}</span>`:''}</td><td>${chip(b.v)}</td>${val(b.a,'a',b.id)}${val(b.b,'b',b.id)}${val(b.g,'g',b.id)}</tr>`).join('')}</tbody></table>
<div class="legend"><span><i style="background:var(--fix)"></i>${T.legend[0]}</span><span><i style="background:var(--chk)"></i>${T.legend[1]}</span><span><i style="background:#D5DDE6"></i>${T.legend[2]}</span><span style="margin-inline-start:auto;display:flex;gap:6px;align-items:center">${icon('info',14)}${T.legHint}</span></div>`
$('foot').innerHTML=`<div><span class="dot"></span>${T.waiting}</div><div><span class="lbl">${T.recent}</span>${[['7eec6c','14:08'],['4f667b','14:10'],['d01173','14:11']].map(([j,t])=>`<span class="scanchip num ${j===S.job?'cur':''}">${j} ${t}</span>`).join('')}</div><div><span class="lbl">${T.assist}</span></div><div><span class="btn">${icon('pdf',18)}${T.pdf}</span></div>`
// dimension strip: extension lines at ±tol, arrowless 45° ticks, dash-dot nominal, actual tick
const num=s=>parseFloat(String(s).replace('−','-'))
function dim(c,tol,u,w=300){
  const h=30, mid=w/2, span=tol*2.6, X=v=>Math.max(4,Math.min(w-4,mid+v/span*(w/2-8)))
  const lo=X(-tol), hi=X(tol), d=num(c[2]), ax=X(d), st=c[3], col=st==='fix'?'var(--fix)':st==='check'?'var(--chk)':'var(--tx)'
  const g='var(--tx-3)'
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="direction:ltr;display:block;overflow:visible">`
  s+=`<line x1="${lo}" y1="3" x2="${lo}" y2="22" stroke="${g}" stroke-width="1"/><line x1="${hi}" y1="3" x2="${hi}" y2="22" stroke="${g}" stroke-width="1"/>`
  s+=`<line x1="${lo-6}" y1="16" x2="${hi+6}" y2="16" stroke="${g}" stroke-width="1"/>`
  s+=`<line x1="${lo-3.5}" y1="19.5" x2="${lo+3.5}" y2="12.5" stroke="${g}" stroke-width="1.5"/><line x1="${hi-3.5}" y1="19.5" x2="${hi+3.5}" y2="12.5" stroke="${g}" stroke-width="1.5"/>`
  s+=`<line x1="${mid}" y1="0" x2="${mid}" y2="26" stroke="${g}" stroke-width="1" stroke-dasharray="5 2 1 2"/>`
  if(Math.abs(d)>tol) s+=`<line x1="${d<0?ax:hi}" y1="16" x2="${d<0?lo:ax}" y2="16" stroke="${col}" stroke-width="1" stroke-dasharray="2 2"/>`
  s+=`<line x1="${ax}" y1="6" x2="${ax}" y2="26" stroke="${col}" stroke-width="2.5"/>`
  s+=`<text x="${lo}" y="${h+4}" text-anchor="middle" font-size="10" fill="var(--tx-3)" font-family="Heebo">−${tol}${u}</text><text x="${hi}" y="${h+4}" text-anchor="middle" font-size="10" fill="var(--tx-3)" font-family="Heebo">+${tol}${u}</text>`
  return s+'</svg>'
}
if(ST==='hover'){
  const cell=$('hovcell').getBoundingClientRect(), tip=document.createElement('div'); tip.className='tip tblock'
  tip.innerHTML=`<span class="crn a"></span><span class="crn b"></span><span class="crn c"></span><span class="crn d"></span><div class="rule">B11 · ${T.ang}</div><div class="r"><span>${T.exp}</span><b class="num">90.0°</b></div><div class="r"><span>${T.tol}</span><b class="num">±1.0°</b></div><div class="r"><span>${T.act}</span><b class="num v-fix">88.0°</b></div><div class="r"><span>${T.dev}</span><b class="num v-fix">−2.0° · ${T.far}</b></div><div style="margin-top:10px">${dim(['90.0','88.0','−2.0','fix'],1.0,'°',284)}</div>`
  document.body.appendChild(tip)
  const th=tip.getBoundingClientRect().height
  tip.style.left=(L==='he'?cell.left+8:cell.right-316-8)+'px'; tip.style.top=(cell.top-th-12)+'px'
}
// model
const view=$('view').getBoundingClientRect(), out={}
const col={FIX:'#FF5C61',CHECK:'#F2B544',OK:'#7F93AA',NB:'#9AA7B8'}
const dir=L==='he'?-1:1
$('part').innerHTML=SQ.render({w:view.width,h:view.height,scale:1.62,yaw:-30,pitch:26,ox:-dir*250,oy:40,out,
  face:l=>`hsl(212 14% ${13+l*21}%)`,edge:'#5E6E82',edgeW:.8,faceOverlay:'url(#dots)',
  extraDefs:'<pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#C9D4E0" opacity=".24"/></pattern>',
  bendColor:b=>col[(byId(b.id)||{}).v],bendW:2,bendDash:null,selected:SEL,nominal:SEL?'rgba(233,238,243,.7)':null,selColor:'#FF5C61',glow:'#E5484D',glowW:16,glowBlur:5,selW:3.5,
  tick:'#738195',markerBox:[44,22],markerFor:b=>(byId(b.id)||{}).v==='FIX'&&b.id!==SEL,
  marker:(b,x,y)=>`<g transform="translate(${x-22},${y-11})"><rect width="44" height="22" rx="2" fill="#111821" stroke="#FF5C61" stroke-width="1"/><text x="22" y="15.5" text-anchor="middle" font-family="Heebo" font-size="13" font-weight="700" fill="#FF8A8D">${b.id}</text></g>`})
// dash the not-bent lines (stage scan)
if(SCAN==='partial') document.querySelectorAll('#part line').forEach(l=>{ if(l.getAttribute('stroke')===col.NB) l.setAttribute('stroke-dasharray','6 5') })
if(SEL){
  const b=byId(SEL), card=document.createElement('div'); card.className='card tblock'
  const row=(n,c,k,tol,extra)=>{const u=k==='g'?'°':'', cls=vcls[c[3]], bad=c[3]==='fix'
    const vd=c[3]==='fix'?`<span class="vd v-fix">${icon('fix',14,2.4)}${T.outT}</span>`:c[3]==='check'?`<span class="vd v-chk">${icon('check',14,1.8)}${T.rev}</span>`:`<span class="vd" style="color:var(--tx-3)">${icon('ok',14,2.2,'style="color:var(--ok)"')}${T.inT}</span>`
    return `<div class="mr ${bad?'bad':''}"><span class="n">${n}</span><span class="nums"><span class="ex num">${c[0]}${u}</span><span class="ex">→</span><span class="ac ${cls}"><span class="num">${c[1]}${u}</span></span></span><span class="dv ${cls==='v-in'?'':cls}"><span class="num">${c[2]}${u}</span></span><span>${vd}${extra?`<div class="lbl v-fix">${extra}</div>`:''}</span><span></span><div class="dim">${dim(c,tol,u,300)}</div></div>`}
  card.innerHTML=`<span class="crn a"></span><span class="crn b"></span><span class="crn c"></span><span class="crn d"></span>
  <div class="tb"><div><div class="k">${T.bend.toUpperCase()}</div><div class="id num">${b.id}</div></div><div><div class="k">${T.res.toUpperCase()}</div><div class="v"><span class="chip FIX" style="height:26px">${icon('fix',14,2.4)}${T.FIX}</span></div></div><div><div class="k">${T.seqK}</div><div class="v num">10 / 12</div></div><div><div class="k">${T.scanK}</div><div class="v num">${S.job}</div></div><div class="x">${icon('close',20)}</div></div>
  <div class="sec"><div class="rule">${T.meas}</div></div>
  ${row(T.fa+' · '+T.mm,b.a,'a','0.5')}${row(T.fb+' · '+T.mm,b.b,'b','0.5')}${row(T.ang,b.g,'g','1.0',T.far)}${row(T.line+' · '+T.mm,['0.00','−0.45','−0.45','check'],'l','0.5')}
  <div class="sec" style="border-top:1px solid var(--line)"><div class="rule">${T.actK}</div></div>
  <div class="act">${icon('check',20,1.8)}<span>${T.action}</span></div>`
  $('view').appendChild(card)
  // orthogonal leader: anchor → 45° stem → shoulder → riser → Y into the card's bottom edge
  document.fonts.ready.then(()=>{
  const vr=$('view').getBoundingClientRect(), cr=card.getBoundingClientRect()
  const cardB=cr.bottom-vr.top, cardNear=dir<0?cr.right-vr.left:cr.left-vr.left
  const a=out.scr[SEL].actual, P=t=>[a.p0[0]+(a.p1[0]-a.p0[0])*t,a.p0[1]+(a.p1[1]-a.p0[1])*t]
  const end=(a.p0[0]-a.p1[0])*dir>0?0:1, A=P(end===0?0.1:0.9)
  const bb=document.querySelector('#part svg').getBBox(), outer=dir<0?bb.x-28:bb.x+bb.width+28
  const RX=dir<0?Math.min(outer,cardNear-56):Math.max(outer,cardNear+56)
  const S1=[A[0]+dir*22,A[1]-22], S2=[RX,S1[1]], J=[RX,cardB+30], E1=[RX-16,cardB], E2=[RX+16,cardB]
  const over=$('over'); over.setAttribute('width',vr.width); over.setAttribute('height',vr.height)
  const ln=(p,q,w,c)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${c}" stroke-width="${w}"/>`
  let s=''
  for(const [w,c] of [[4,'#0B1016'],[1.25,'#E9EEF3']]) s+=ln(A,S1,w,c)+ln(S1,S2,w,c)+ln(S2,J,w,c)+ln(J,E1,w,c)+ln(J,E2,w,c)
  s+=`<circle cx="${A[0]}" cy="${A[1]}" r="9" fill="none" stroke="#FF5C61" stroke-width="1.25"/><circle cx="${A[0]}" cy="${A[1]}" r="3.5" fill="#fff"/>`
  s+=`<rect x="${J[0]-2.5}" y="${J[1]-2.5}" width="5" height="5" fill="#E9EEF3"/><rect x="${S2[0]-2}" y="${S2[1]-2}" width="4" height="4" fill="#E9EEF3"/>`
  over.innerHTML=s
  })
}
</script>
</body></html>
