<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>D3 studio</title>
<style>
@font-face{font-family:Heebo;font-weight:300 900;src:url(heebo-hebrew.woff2) format('woff2');unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:300 900;src:url(heebo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
:root{--bg:#E9ECF0;--s1:#FFFFFF;--s2:#F4F6F8;--line:#C5CCD5;--tx:#0A0F16;--tx2:#323B47;--tx3:#5E6875;
  --navy:#01416F;--blue:#0067B8;--blue-bg:#DCEBF8;--ok:#127A45;--chk:#9A6200;--fix:#C4261D;--r:6px}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;background:var(--bg);color:var(--tx);font:500 18px/1.3 Heebo,system-ui,sans-serif;display:grid;grid-template-rows:88px 96px 1fr;overflow:hidden}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.top{display:flex;align-items:center;gap:20px;padding:0 20px;background:var(--navy);color:#fff}
.top img{height:40px}
.top .pn{font-size:30px;font-weight:800}
.top .nm{font-size:18px;opacity:.8}
.sp{flex:1}
.tb{height:56px;padding:0 22px;display:flex;align-items:center;border-radius:var(--r);font-size:19px;font-weight:700;border:2px solid rgba(255,255,255,.35);color:#fff;white-space:nowrap}
.tb.w{background:#fff;color:var(--navy);border-color:#fff}
.unsaved{background:#FFC233;color:#111;font-weight:800;font-size:16px;padding:6px 12px;border-radius:4px}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:12px 20px 0}
.st{border-radius:var(--r);background:var(--s1);display:flex;align-items:center;gap:12px;padding:0 14px;font-size:17px;font-weight:700;color:var(--tx2);border:2px solid transparent}
.st .k{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;background:var(--s2);font-weight:800;flex:none;border:2px solid var(--line)}
.st small{display:block;font-size:13px;font-weight:500;color:var(--tx3)}
.st.done .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.st.cur{border-color:var(--blue);background:var(--blue-bg);color:var(--tx)}.st.cur .k{background:var(--blue);color:#fff;border-color:var(--blue)}
.st.blk .k{border-color:var(--fix);color:var(--fix)}
.work{display:grid;grid-template-columns:1fr 560px;gap:12px;padding:12px 20px 20px;min-height:0}
.canvas{position:relative;background:var(--s1);border-radius:var(--r);overflow:hidden;border:2px solid var(--line)}
#part{position:absolute;inset:0}
.ch{position:absolute;top:0;inset-inline:0;display:flex;align-items:center;gap:10px;padding:14px 16px}
.ch h2{font-size:24px;font-weight:800}
.g{display:flex;gap:6px}
.g span{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:4px;font-size:16px;font-weight:700;background:var(--s2);color:var(--tx3)}
.g .d{background:#E2F2E9;color:var(--ok)}.g .c{background:var(--blue);color:#fff}
.btn{height:64px;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:var(--r);font-size:20px;font-weight:800;background:var(--s1);border:2px solid var(--tx2);color:var(--tx);white-space:nowrap}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.zoom{position:absolute;bottom:16px;inset-inline-end:16px;display:flex;gap:8px}
.zoom span{width:64px;height:64px;border-radius:var(--r);border:2px solid var(--line);background:var(--s1);display:grid;place-items:center;font-size:30px;font-weight:700}
.tools{position:absolute;bottom:16px;inset-inline-start:16px;display:flex;gap:8px}
aside{background:var(--s1);border-radius:var(--r);border:2px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:12px;min-height:0}
aside h3{font-size:24px;font-weight:800}
aside p{font-size:16px;color:var(--tx3);font-weight:500;margin-top:-6px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{height:64px;border-radius:var(--r);border:2px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px;font-size:22px;font-weight:800}
.chip .k{width:36px;height:36px;border-radius:4px;background:var(--tx);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.chip.mv{border-color:var(--blue);background:var(--blue-bg)}.chip.mv .k{background:var(--blue)}
.chip small{font-size:13px;color:var(--blue);font-weight:700;display:block;line-height:1}
.chip.last{box-shadow:0 0 0 3px var(--blue) inset}
.now{background:var(--s2);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.now b{font-size:20px}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.foot{margin-top:auto;display:flex;gap:8px}.foot .btn{flex:1}
</style></head><body>
<div class="top">
  <img src="sherman-logo-white.png" alt="Sherman">
  <span style="width:2px;height:40px;background:rgba(255,255,255,.3)"></span>
  <div><div class="pn num">10839000</div><div class="nm">Joggle bracket · גרסה <span class="num">01</span></div></div>
  <span class="sp"></span>
  <span class="unsaved">● יש שינויים שלא נשמרו</span>
  <span class="tb">English</span>
  <span class="tb w">סיום, חזרה לאשף</span>
</div>
<div class="steps" id="steps"></div>
<div class="work">
  <section class="canvas">
    <div id="part"></div>
    <div class="ch"><h2>הכיפופים בדגם</h2><span class="sp"></span><div class="g"><span class="d">✓ אישור כיפופים</span><span class="d">✓ סדר כיפוף</span><span class="c">3 · מהלכים (רשות)</span></div></div>
    <div class="tools"><span class="btn">+ כיפוף חסר</span><span class="btn">מכופף / פרוס</span><span class="btn">PDF</span></div>
    <div class="zoom"><span>+</span><span>−</span><span>⟲</span></div>
  </section>
  <aside>
    <h3>סדר הכיפופים</h3><p>אתם קובעים את סדר העבודה. הסדר מה-CAD הוא רק נקודת פתיחה.</p>
    <div class="chips" id="chips"></div>
    <div class="now"><b>סומנו עכשיו: <span class="num">B9</span></b><div class="row2"><span class="btn pri">+ מהלך</span><span class="btn">בלי מהלך</span></div></div>
    <div class="foot"><span class="btn pri">אישור הסדר</span><span class="btn">ביטול האחרון</span></div>
  </aside>
</div>
<script src="shared.js"></script>
<script>
const steps=[['פרטי חלק','done','הושלם'],['דגם CAD','done','הושלם'],['שרטוט','done','הושלם'],['חלק פרוס','opt','רשות'],['כיפופים וסדר','cur','אתם כאן'],['סבולות','todo','הבא'],['ערכים צפויים','opt','רשות'],['שחרור','blk','חסום']]
document.getElementById('steps').innerHTML=steps.map(([t,s,sub],i)=>`<div class="st ${s}"><span class="k">${s==='done'?'✓':i+1}</span><div>${t}<small>${sub}</small></div></div>`).join('')
document.getElementById('chips').innerHTML=SQ.bends.map(b=>`<div class="chip ${b.move?'mv':''} ${b.id==='B9'?'last':''}"><span class="k num">${b.seq}</span><div><span class="num">${b.id}</span>${b.move?'<small>מהלך 1</small>':''}</div></div>`).join('')
const el=document.getElementById('part'), r=el.parentElement.getBoundingClientRect()
el.innerHTML=SQ.render({w:r.width,h:r.height,scale:1.95,yaw:-30,pitch:26,ox:0,oy:0,
  face:l=>`hsl(212 10% ${70+l*20}%)`,edge:'#56606C',edgeW:1.2,
  bendColor:b=>b.move?'#0067B8':'#0A0F16',bendW:3.5,selected:'B9',selColor:'#0067B8',glow:'#3AA0F0',glowW:20,glowBlur:5,selW:6,
  tick:'#0A0F16',markerBox:[42,42],markerFor:()=>true,
  marker:(b,x,y,sel)=>`<g transform="translate(${x-21},${y-21})">${sel?'<rect x="-5" y="-5" width="52" height="52" rx="7" fill="none" stroke="#0067B8" stroke-width="3"/>':''}<rect width="42" height="42" rx="5" fill="${sel||b.move?'#0067B8':'#0A0F16'}"/><text x="21" y="29" text-anchor="middle" font-family="Heebo" font-size="22" font-weight="800" fill="#fff">${b.seq}</text></g>`})
</script>
</body></html>
