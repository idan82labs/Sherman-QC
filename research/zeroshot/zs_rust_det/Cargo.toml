[package]
name = "zs_rust"
version = "0.1.0"
edition = "2021"
description = "The zero-shot bend lane v3 (zs_lane_v3_rs) as one portable, deterministic binary: called as a subprocess, files in/out"
publish = false

[[bin]]
name = "zs_rust"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
# pure-Rust libm (musl port): every transcendental, identical on every target
libm = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
