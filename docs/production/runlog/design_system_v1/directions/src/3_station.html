<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>D3 station</title>
<style>
@font-face{font-family:Heebo;font-weight:300 900;src:url(heebo-hebrew.woff2) format('woff2');unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:300 900;src:url(heebo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
:root{--bg:#050608;--s1:#0E1013;--s2:#171A1F;--s3:#22262D;--line:#2A2F37;
  --tx:#FFFFFF;--tx2:#C3C8D0;--tx3:#8C939E;--blue:#1E8FE1;
  --fix:#E0352B;--chk:#F2A900;--ok:#18A957;--r:6px}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;background:var(--bg);color:var(--tx);font:500 18px/1.3 Heebo,system-ui,sans-serif;display:grid;grid-template-rows:124px 1fr 96px;overflow:hidden}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header{display:grid;grid-template-columns:300px 1fr 640px;gap:12px;padding:12px 16px}
.brand{background:var(--s1);border-radius:var(--r);display:flex;flex-direction:column;justify-content:center;padding:0 22px;gap:8px}
.brand img{width:230px}
.brand span{color:var(--tx3);font-size:15px}
.part{background:var(--s1);border-radius:var(--r);display:flex;align-items:center;gap:36px;padding:0 28px}
.part .pn{font-size:40px;font-weight:800;line-height:1}
.part .pn small{display:block;font-size:16px;font-weight:500;color:var(--tx3);margin-top:6px}
.kv{font-size:15px;color:var(--tx3)}.kv b{display:block;font-size:28px;color:var(--tx);font-weight:700}
.big{background:var(--fix);border-radius:var(--r);display:flex;align-items:center;gap:24px;padding:0 28px}
.big .w{font-size:64px;font-weight:900;line-height:1}
.big .c{font-size:22px;font-weight:600;line-height:1.35}
.big .c b{font-size:30px}
.big .x{width:72px;height:72px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;font-size:40px;font-weight:900;margin-inline-start:auto}
main{display:grid;grid-template-columns:1fr 760px;gap:12px;padding:0 16px;min-height:0}
.view{position:relative;background:var(--s1);border-radius:var(--r);overflow:hidden}
#part{position:absolute;inset:0}
.legend{position:absolute;top:18px;inset-inline-start:20px;display:flex;gap:10px}
.legend span{font-size:17px;font-weight:700;padding:8px 14px;border-radius:4px}
.list{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}
.more{background:var(--s1);border-radius:var(--r);height:44px;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:16px}
.row{display:grid;grid-template-columns:110px 150px 1fr 1fr 1fr;align-items:center;height:74px;background:var(--s1);border-radius:var(--r);padding:0 18px;flex:none}
.row .id{font-size:30px;font-weight:800}
.st{height:46px;border-radius:4px;display:grid;place-items:center;font-size:20px;font-weight:800;width:130px}
.st.FIX{background:var(--fix);color:#fff}.st.CHECK{background:var(--chk);color:#111}.st.OK{background:var(--ok);color:#06210F}
.c{text-align:end;font-size:24px;font-weight:700}.c.fix{color:#FF6A60}.c.chk{color:#FFC233}
.c.nm{font-size:16px;color:var(--tx3);font-weight:500}
.lh{display:grid;grid-template-columns:110px 150px 1fr 1fr 1fr;padding:0 18px;color:var(--tx3);font-size:15px;height:24px;align-items:end}
.lh .c{font-size:15px;font-weight:500;color:var(--tx3)}
.exp{background:var(--s2);border-radius:var(--r);box-shadow:0 0 0 3px var(--fix);padding:0 0 16px;flex:none}
.exp .row{background:transparent}
.dt{display:grid;grid-template-columns:110px 1fr 160px 120px;align-items:center;margin:0 18px;padding:12px 0;border-top:1px solid var(--line);gap:8px}
.dt .n{font-size:20px;color:var(--tx2);font-weight:600}
.dt .ea{font-size:30px;font-weight:700}.dt .ea s{text-decoration:none;color:var(--tx3);font-weight:500}
.dt .t{font-size:16px;color:var(--tx3)}
.dt .d{font-size:32px;font-weight:800;text-align:end}
.dt .ok{font-size:18px;font-weight:800;text-align:center;border-radius:4px;padding:6px 0}
.dt.bad{background:rgba(224,53,43,.14);margin:0 8px;padding:12px 10px;border-radius:4px;border:0}
.act{margin:12px 18px 0;background:var(--fix);color:#fff;border-radius:4px;padding:14px 18px;font-size:21px;font-weight:700}
footer{display:flex;gap:12px;padding:12px 16px}
.b{display:flex;align-items:center;justify-content:center;gap:12px;height:72px;padding:0 28px;background:var(--s2);border-radius:var(--r);font-size:21px;font-weight:700;color:var(--tx);border:2px solid var(--line)}
.b.on{border-color:var(--blue);background:#0B2A44}
.b.pri{background:var(--blue);border-color:var(--blue)}
.b svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2}
.sp{flex:1}
.wait{display:flex;align-items:center;gap:12px;font-size:19px;color:var(--tx2);padding:0 18px;background:var(--s1);border-radius:var(--r)}
.wait i{width:14px;height:14px;border-radius:50%;background:var(--ok)}
</style></head><body>
<header>
  <div class="brand"><img src="sherman-logo-white.png" alt="Sherman"><span>עמדה <span class="num">cell-1</span> · <span class="num">14:08</span> · English</span></div>
  <div class="part"><div class="pn"><span class="num">10839000</span><small>Joggle bracket · מתכון <span class="num">v1</span> · עבודה <span class="num">7eec6c</span></small></div><div class="kv">כיפופים בוצעו<b class="num">12/12</b></div></div>
  <div class="big"><div><div class="w">לתקן</div></div><div class="c"><b class="num">4</b> לתיקון · <b class="num">8</b> לבדיקה<br>נמצאה חריגה מטולרנס</div><div class="x">✕</div></div>
</header>
<main>
  <section class="view">
    <div id="part"></div>
    <div class="legend"><span style="background:var(--fix)">לתקן</span><span style="background:var(--chk);color:#111">לבדוק</span><span style="background:var(--ok);color:#06210F">תקין</span></div>
  </section>
  <section class="list" id="list"></section>
</main>
<footer>
  <div class="b on"><svg viewBox="0 0 24 24"><path d="M3 7V3h4M17 3h4v4M21 17v4h-4M7 21H3v-4M6 12h12"/></svg>סריקה</div>
  <div class="b"><svg viewBox="0 0 24 24"><path d="M12 2 21 7v10l-9 5-9-5V7z"/></svg>שרטוט</div>
  <div class="b">מפת סטיות</div>
  <div class="b on">חריגות בלבד</div>
  <span class="sp"></span>
  <div class="wait"><i></i>ממתין לסריקה הבאה</div>
  <div class="b">הורדת PDF</div>
  <div class="b pri"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg>החריגה הבאה</div>
</footer>
<script src="shared.js"></script>
<script>
const {bends,byId}=SQ, SEL='B11'
const heV={FIX:'לתקן',CHECK:'לבדוק',OK:'תקין'}
const cell=(c,k)=>c[3]==='nm'?`<span class="c nm">לא נמדד</span>`:`<span class="c ${c[3]==='fix'?'fix':c[3]==='check'?'chk':''}"><span class="num">${c[2]}${k==='g'?'°':''}</span></span>`
const row=b=>`<div class="row"><span class="id"><span class="num">${b.id}</span></span><span class="st ${b.v}">${heV[b.v]}</span>${cell(b.a,'a')}${cell(b.b,'b')}${cell(b.g,'g')}</div>`
const b=byId(SEL)
const dt=(n,c,k,t)=>{const bad=c[3]==='fix',u=k==='g'?'°':'',mm=k==='g'?'°':' mm';return `<div class="dt ${bad?'bad':''}"><span class="n">${n}</span><span><div class="ea"><span class="num"><s>${c[0]}${u}</s> → ${c[1]}${mm}</span></div><div class="t">טולרנס <span class="num">±${t}${u}</span>${bad?' · כיפוף יתר':''}</div></span><span class="d"><span class="num">${c[2]}${u}</span></span><span class="ok" style="background:${bad?'var(--fix)':'var(--ok)'};color:${bad?'#fff':'#06210F'}">${bad?'✕ חריגה':'✓ תקין'}</span></div>`}
const exp=`<div class="exp">${row(b)}${dt('כנף A',b.a,'a','0.5')}${dt('כנף B',b.b,'b','0.5')}${dt('זווית',b.g,'g','1.0')}<div class="act">${SQ.he.action}</div></div>`
const vis=['B12','B6','B11','B8','B9']
document.getElementById('list').innerHTML=`<div class="lh"><span>כיפוף</span><span>תוצאה</span><span class="c">כנף A Δ</span><span class="c">כנף B Δ</span><span class="c">זווית Δ</span></div><div class="more">▲ עוד 7 כיפופים למעלה</div>`+vis.map(id=>id===SEL?exp:row(byId(id))).join('')
const el=document.getElementById('part'), r=el.parentElement.getBoundingClientRect()
const col={FIX:'#E0352B',CHECK:'#F2A900',OK:'#18A957'}
el.innerHTML=SQ.render({w:r.width,h:r.height,scale:2.0,yaw:-28,pitch:24,ox:0,oy:20,
  face:l=>`hsl(215 8% ${20+l*26}%)`,edge:'#7D8693',edgeW:1,
  bendColor:b=>col[b.v],bendW:4,selected:SEL,selColor:'#FF4A3D',glow:'#E0352B',glowW:30,glowBlur:8,selW:8,selCore:'#fff',
  tick:'#C3C8D0',markerBox:[64,40],markerFor:b=>b.v==='FIX',
  marker:(b,x,y,sel)=>`<g transform="translate(${x-32},${y-20})">${sel?'<rect x="-6" y="-6" width="76" height="52" rx="8" fill="none" stroke="#fff" stroke-width="3"/>':''}<rect width="64" height="40" rx="5" fill="${sel?'#E0352B':'#0E1013'}" stroke="#E0352B" stroke-width="3"/><text x="32" y="28" text-anchor="middle" font-family="Heebo" font-size="22" font-weight="800" fill="#fff">${b.id}</text></g>`})
</script>
</body></html>
