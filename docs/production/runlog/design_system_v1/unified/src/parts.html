<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>Parts</title>
<link rel="stylesheet" href="tokens.css">
<script src="icons.js"></script><script src="shell.js"></script>
<style>
body{display:grid;grid-template-columns:248px 1fr}
.app{display:flex;flex-direction:column;min-width:0;padding:0 var(--s-8)}
.ph{display:flex;align-items:flex-end;gap:var(--s-4);padding:var(--s-8) 0 var(--s-6)}
.ph h1{font-size:var(--t-2xl);font-weight:700;letter-spacing:-.01em;line-height:1.1}
.ph p{color:var(--tx-3);font-size:var(--t-md);margin-top:6px}
.sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-2);background:var(--surface)}
.kpi{padding:var(--s-5) var(--s-6);border-inline-start:1px solid var(--line)}
.kpi:first-child{border:0}
.kpi .l{font-size:var(--t-sm);color:var(--tx-3);display:flex;align-items:center;gap:8px}
.kpi .v{font-size:var(--t-2xl);font-weight:700;margin-top:6px;line-height:1}
.kpi .s{font-size:var(--t-xs);color:var(--tx-3);margin-top:6px}
.bar{display:flex;align-items:center;gap:var(--s-3);margin:var(--s-6) 0 var(--s-3)}
.tabs{display:flex;gap:var(--s-6);border-bottom:1px solid var(--line);flex:1}
.tabs span{height:44px;display:flex;align-items:center;gap:8px;font-size:var(--t-md);color:var(--tx-2);box-shadow:inset 0 -2px 0 transparent}
.tabs span.on{color:var(--tx);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.tabs .n{height:20px;display:inline-flex;align-items:center;font-size:var(--t-xs);color:var(--tx-3);border:1px solid var(--line-2);border-radius:2px;padding:0 5px}
.field{display:flex;align-items:center;gap:8px;height:40px;width:320px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-1);background:var(--surface);color:var(--tx-3);font-size:var(--t-sm)}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:var(--t-xs);font-weight:500;color:var(--tx-3);text-align:start;height:40px;padding:0 var(--s-4);background:var(--surface-2);border-bottom:1px solid var(--line)}
td{height:64px;padding:0 var(--s-4);border-bottom:1px solid var(--line);font-size:var(--t-md)}
tr:last-child td{border-bottom:0}
tr.hl td{background:#FAFCFE}
.pn{font-weight:700;font-size:var(--t-lg)}
.nm{color:var(--tx-2);font-size:var(--t-sm)}
.st{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-sm);font-weight:600}
.st i{width:8px;height:8px;border-radius:1px}
.prog{display:flex;gap:3px}.prog i{width:14px;height:6px;background:var(--line-2)}.prog i.d{background:var(--tx)}
.last{display:flex;align-items:center;gap:8px}
.cap{font-size:var(--t-xs);color:var(--tx-3);margin-top:var(--s-3)}
</style></head><body class="theme-light">
<script>document.write(shell('חלקים לייצור'))</script>
<div class="app">
  <div class="ph"><div><h1>חלקים לייצור</h1><p>כל חלק עובר קליטה: קבצים, כיפופים וסדר, סבולות ושחרור למתכון שהקו בודק מולו.</p></div><span class="sp"></span><span class="btn">${''}</span></div>
  <div class="kpis" id="kpis"></div>
  <div class="bar"><div class="tabs" id="tabs"></div><div class="field" id="search"></div><span class="btn primary lg" id="new"></span></div>
  <div class="tbl"><table><thead><tr><th>מק״ט</th><th>שם וגרסה</th><th>מצב</th><th>התקדמות קליטה</th><th>מתכון</th><th>סריקה אחרונה</th><th>עודכן</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="cap">שורה 1 היא החלק האמיתי 10839000 מהריצה 20261019T-real-v2. שורות 2–5 להמחשת מצבים בלבד.</div>
</div>
<script>
const $=id=>document.getElementById(id)
document.querySelector('.ph .btn').outerHTML=`<span class="btn">${icon('pdf',18)}ייצוא רשימה</span>`
$('kpis').innerHTML=[['release','משוחררים לקו','1','מתכון v1 · 10839000'],['parts','בקליטה','3','2 דורשים תשומת לב'],['scan','סריקות היום','3','אחרונה 14:11 · cell-1'],['fix','חריגות פתוחות','4','בסריקה 7eec6c']].map(([i,l,v,s],k)=>`<div class="kpi"><div class="l">${icon(i,18)}${l}</div><div class="v num" style="${k===3?'color:var(--fix)':''}">${v}</div><div class="s">${s}</div></div>`).join('')
$('tabs').innerHTML=`<span class="on">הכול <span class="n num">5</span></span><span>בקליטה <span class="n num">3</span></span><span>מוכנים לשחרור <span class="n num">1</span></span><span>משוחררים <span class="n num">1</span></span>`
$('search').innerHTML=icon('search',18)+'חיפוש מק״ט או שם'
$('new').innerHTML=icon('add',20,2)+'חלק חדש'
const S={RELEASED:['שוחרר','var(--ok)'],READY:['מוכן לשחרור','var(--accent)'],TOL:['חסרות סבולות','var(--chk-solid)'],ORDER:['חסר סדר כיפוף','var(--chk-solid)'],CAD:['חסר CAD','var(--tx-3)']}
const rows=[['10839000','Joggle bracket 10839000','01','RELEASED',8,'v1',['7eec6c','FIX','14:08'],'היום 14:05'],
 ['10712040','Mounting rail','B','READY',7,'—',null,'אתמול'],
 ['10655210','Chassis side panel','03','TOL',5,'—',null,'אתמול'],
 ['10598117','Cable tray bracket','A','ORDER',4,'—',null,'16.10'],
 ['10933002','Front cover','01','CAD',1,'—',null,'15.10']]
$('rows').innerHTML=rows.map(([pn,nm,rev,st,p,rc,last,up],i)=>`<tr class="${i===0?'hl':''}"><td><span class="pn num">${pn}</span></td><td><div>${nm}</div><div class="nm">גרסה <span class="num">${rev}</span></div></td>
<td><span class="st"><i style="background:${S[st][1]}"></i>${S[st][0]}</span></td>
<td><div class="prog">${Array.from({length:8},(_,k)=>`<i class="${k<p?'d':''}"></i>`).join('')}</div><div class="nm" style="margin-top:4px"><span class="num">${p}</span> מתוך <span class="num">8</span> שלבים</div></td>
<td class="num">${rc}</td>
<td>${last?`<span class="last"><span class="chip FIX" style="height:26px">${icon('fix',14,2.4)}לתקן</span><span class="num nm">${last[0]} · ${last[2]}</span></span>`:'<span class="nm">—</span>'}</td>
<td class="nm">${up}</td><td style="text-align:end"><span class="btn ${i===0?'':'quiet'}">${i===0?'צפייה במתכון':'המשך קליטה'}${icon('chevron',16,1.5,'style="transform:scaleX(-1)"')}</span></td></tr>`).join('')
</script>
</body></html>
